<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Epic Explorer</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<!-- Heading -->

<header class="hero">

<h1>Epic Explorer</h1>
<p>Explore Tourist Destinations Across India</p>

</header>


<!-- Horizontal Region Navbar -->

<div class="region-navbar">

<button onclick="showRegion('north')">North India</button>

<button onclick="showRegion('east')">East India</button>
<button onclick="showRegion('west')">West India</button>
<button onclick="showRegion('central')">Central India</button>

</div>


<!-- Destination Cards -->

<div class="container mt-5">

<div class="row" id="destinationContainer">

</div>

</div>


<footer>

<p>© 2026 Epic Explorer</p>

</footer>


<script src="script.js"></script>

</body>

</html>
